name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check syntax and undefined names
        run: ruff check carequeue tests --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -q
